<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 640px; height: 640px; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(circle at 50% 36%, #2b8a72 0%, #1f6f5c 48%, #0f3a2f 100%);
    font-family: Manrope, -apple-system, "Helvetica Neue", Arial, sans-serif; color: #fff;
  }
  .logo { text-align: center; transform: translateY(-4px); }
  .mark { display: block; width: 136px; height: 136px; margin: 0 auto; }
  .name { font-size: 112px; font-weight: 800; letter-spacing: -3px; line-height: 1; margin-top: 22px; }
  .kind { font-size: 30px; font-weight: 700; letter-spacing: 11px; padding-left: 11px; color: #9fe0c9; margin-top: 18px; }
</style>
<body>
  <div class="logo">
    <!-- знак из шапки сайта, в обратных цветах -->
    <svg class="mark" viewBox="0 0 28 28" aria-hidden="true">
      <rect x="3" y="3" width="22" height="22" rx="6" fill="#fff"/>
      <path d="M8 17h12M8 12h12" stroke="#1f6f5c" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <div class="name">Отвес</div>
    <div class="kind">ЗАЯВКИ</div>
  </div>
</body>
</html>
