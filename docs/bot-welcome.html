<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 640px; height: 360px; overflow: hidden; }
  body {
    background: radial-gradient(circle at 28% 40%, #2b8a72 0%, #1f6f5c 48%, #0f3a2f 100%);
    font-family: Manrope, -apple-system, "Helvetica Neue", Arial, sans-serif; color: #fff;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 36px 0 40px; box-sizing: border-box;
  }
  .left { display: flex; flex-direction: column; }
  .pill {
    align-self: flex-start; font-size: 12px; font-weight: 800; letter-spacing: 2px;
    color: #0f3a2f; background: #9fe0c9; border-radius: 999px; padding: 5px 12px;
  }
  .name { font-size: 66px; font-weight: 800; letter-spacing: -2px; line-height: 1; margin-top: 16px; }
  .kind { font-size: 15px; font-weight: 700; letter-spacing: 7px; color: #9fe0c9; margin-top: 10px; }
  .sub { font-size: 17px; font-weight: 500; color: #d6efe6; margin-top: 18px; line-height: 1.35; }
  .hint { font-size: 13px; font-weight: 600; color: #9fe0c9; margin-top: 22px; }
  .features { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 700; }
  .icon {
    width: 38px; height: 38px; border-radius: 11px; background: rgba(159, 224, 201, 0.16);
    border: 1px solid rgba(159, 224, 201, 0.35); display: grid; place-items: center;
  }
  .icon svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2;
              stroke-linecap: round; stroke-linejoin: round; }
</style>
<body>
  <div class="left">
    <div class="pill">ДЕМО-БОТ</div>
    <div class="name">Отвес</div>
    <div class="kind">ЗАЯВКИ</div>
    <div class="sub">Заявка с сайта за пару секунд<br>у менеджера в Telegram</div>
    <div class="hint">Собрано на n8n</div>
  </div>
  <div class="features">
    <div class="row">
      <div class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/>
        <path d="M3 9h18M3 14.5h18M9 9v11"/></svg></div>
      Google Таблица
    </div>
    <div class="row">
      <div class="icon"><svg viewBox="0 0 24 24"><path d="M22 2 11 13"/>
        <path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg></div>
      Уведомление менеджеру
    </div>
    <div class="row">
      <div class="icon"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/>
        <path d="m22 6-10 7L2 6"/></svg></div>
      Письмо клиенту
    </div>
    <div class="row">
      <div class="icon"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="m9 12 2 2 4-4"/></svg></div>
      Защита от спама
    </div>
    <div class="row">
      <div class="icon"><svg viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
        <path d="M12 9v4M12 17h.01"/></svg></div>
      Алерт при сбое
    </div>
  </div>
</body>
</html>
